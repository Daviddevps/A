<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Measurement</title>
    <link rel="stylesheet" href="conversion.css">
</head>
<body>
<div id="container">
    <div id="container1">
        <h3>Metric/Imperial Unit Converter</h3>
        <input type="number" id="input_style">
        <button id="btn"> Convert </button>


    </div>

    <div id="container2">
        <div class="style">
           Length (meter/feet)
            <p id="length-result"></p>

        </div>
        <div class="style">
            Volume (liters/gallons)
            <p id="volume-result"></p>
        </div>
        <div class="style">
            Mass (kilograms/pounds)
            <p id="mass-result"></p>
        </div>


    </div>

</div>
    <script src="conversion.js"></script>

</body>
</html>
